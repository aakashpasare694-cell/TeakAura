name = "teakaura"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "teak-furniture-db"
database_id = "your-d1-database-id-here" # Replace with `npx wrangler d1 create teak-furniture-db` output

# Cloudflare R2 Bucket Binding (for Product & Custom Reference Images)
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "teak-furniture-images"

# Environment Variables
[vars]
ENVIRONMENT = "production"
R2_PUBLIC_URL = "https://images.yourdomain.com" # Custom domain or R2 dev URL
JWT_SECRET = "super-secret-teak-jwt-key-change-in-production"
ADMIN_EMAIL = "admin@teakaura.com"
